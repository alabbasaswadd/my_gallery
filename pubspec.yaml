name: my_gallery
description: "MyGallery Admin App - إدارة المعرض"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  flutter_screenutil: ^5.9.3

  # State management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0

  # Routing
  go_router: ^17.1.0
  smooth_page_indicator: ^1.1.0

  # Networking
  dio: ^5.7.0
  http_parser: ^4.0.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.4
  get_it: ^9.2.1
  url_launcher: ^6.3.0
  flutter_colorpicker: ^1.1.0
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.9.5
  freezed: ^3.0.6
  retrofit_generator: ^10.2.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
  color: "#C0446A"
  image: assets/images/app_icon.png
  color_dark: "#6D1A38"
  image_dark: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon_fg.png
    icon_background_color: "#C0446A"
    image_dark: assets/images/app_icon_fg.png
    icon_background_color_dark: "#6D1A38"
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#C0446A"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Cairo-Bold
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
