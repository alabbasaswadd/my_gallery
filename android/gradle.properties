org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC
# Run Kotlin compilation inside Gradle's own JVM to eliminate the separate
# Kotlin daemon process and its own JVM overhead on memory-constrained machines.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.caching.enabled=false

org.gradle.caching=false
org.gradle.daemon=false